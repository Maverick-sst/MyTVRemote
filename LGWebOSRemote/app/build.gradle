plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Release signing is optional. When the CI secrets are present the workflow
// materialises a keystore and exports these variables, so every build is signed
// with the same key and can be installed as an update. Without them we fall back
// to the debug key so pull-request builds still produce an installable APK.
def keystorePath = System.getenv("KEYSTORE_FILE")
def hasReleaseSigning = keystorePath != null &&
        !keystorePath.trim().isEmpty() &&
        file(keystorePath).exists()

android {
    namespace 'com.maverick.lgremote'
    compileSdk 35

    defaultConfig {
        applicationId 'com.maverick.lgremote'
        minSdk 23
        targetSdk 28
        versionCode 4
        versionName '1.3'
        resourceConfigurations += ['en']
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(keystorePath)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        buildConfig false
    }

    // This app is sideloaded, not published on Google Play, so an older
    // targetSdk is intentional and the Play-only warning is not actionable.
    lint {
        disable 'ExpiredTargetSdkVersion'
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
