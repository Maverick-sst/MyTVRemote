name: Build My TV Remote APK

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify project structure
        run: |
          test -f LGWebOSRemote/settings.gradle
          test -f LGWebOSRemote/build.gradle
          test -f LGWebOSRemote/app/build.gradle
          test -f LGWebOSRemote/app/src/main/AndroidManifest.xml
          test -x LGWebOSRemote/gradlew

      - name: Restore release keystore
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not configured"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: LGWebOSRemote
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Prepare download file
        run: |
          cp LGWebOSRemote/app/build/outputs/apk/release/app-release.apk MyTVRemote.apk
          ls -lh MyTVRemote.apk
          sha256sum MyTVRemote.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyTVRemote-apk
          path: MyTVRemote.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish latest APK
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: MyTVRemote-apk

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest \
              --title "My TV Remote (latest)" \
              --notes "Always-current signed APK. Download \`MyTVRemote.apk\` and install it on your phone. Android may ask you to allow installs from your browser." \
              --latest
          fi
          gh release upload latest MyTVRemote.apk --clobber
          gh release edit latest --latest
