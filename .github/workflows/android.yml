name: Build LG webOS Remote APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-build
  cancel-in-progress: true

jobs:
  build:
    name: Compile Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify project structure
        run: |
          test -f LGWebOSRemote/settings.gradle
          test -f LGWebOSRemote/build.gradle
          test -f LGWebOSRemote/app/build.gradle
          test -f LGWebOSRemote/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        working-directory: LGWebOSRemote
        run: |
          gradle --version
          gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyTVRemote-debug-apk
          path: LGWebOSRemote/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
